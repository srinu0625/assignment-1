<!DOCTYPE html>
<html>
<head>
    <title>How It Works - Knowledge Builder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 70%;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
        }

        h3 {
            color: #333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔎 Type Something (Pen, Car, Curry, Laptop)</h2>

    <input type="text" id="userInput" placeholder="Enter item name">
    <button onclick="searchItem()">Search</button>

    <div class="result" id="output"></div>
</div>

<script>

const database = {
    pen: {
        materials: "Plastic body, ink, refill tube, metal tip",
        howToMake: "1. Create plastic body\n2. Insert ink refill\n3. Attach metal tip\n4. Seal properly",
        functionality: "Ink flows through nib when pressure is applied.",
        reusable: "Refill can be replaced in reusable pens."
    },
    car: {
        materials: "Steel frame, engine, tires, electronics, fuel system",
        howToMake: "1. Build chassis\n2. Install engine\n3. Add transmission\n4. Electrical wiring\n5. Final assembly",
        functionality: "Engine converts fuel to mechanical energy to rotate wheels.",
        reusable: "Parts like engine, battery, tires can be replaced."
    },
    curry: {
        materials: "Vegetables/meat, spices, oil, salt, water",
        howToMake: "1. Heat oil\n2. Add spices\n3. Add main ingredient\n4. Cook with water\n5. Simmer",
        functionality: "Heat cooks ingredients and blends flavors.",
        reusable: "Can be refrigerated and reheated."
    },
    laptop: {
        materials: "Motherboard, CPU, RAM, SSD, battery, screen",
        howToMake: "1. Assemble motherboard\n2. Install CPU & RAM\n3. Connect storage\n4. Attach display\n5. Install OS",
        functionality: "Processes data via CPU and displays output on screen.",
        reusable: "Upgradeable RAM, SSD; repairable parts."
    }
};

function searchItem() {
    const input = document.getElementById("userInput").value.toLowerCase();
    const output = document.getElementById("output");

    if (database[input]) {
        const item = database[input];
        output.innerHTML = `
            <h3>Materials Needed:</h3>
            <p>${item.materials}</p>

            <h3>How to Make:</h3>
            <pre>${item.howToMake}</pre>

            <h3>How It Works:</h3>
            <p>${item.functionality}</p>

            <h3>Reusability:</h3>
            <p>${item.reusable}</p>
        `;
    } else {
        output.innerHTML = "<p>❌ Item not found in database.</p>";
    }
}

</script>

</body>
</html>
